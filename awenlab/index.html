<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AwenLab — Prototipo (Desktop + Mobile)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- design tokens + extracted bitmap classes from the Claude Design handoff -->
<link rel="stylesheet" href="components/fig-tokens.css">
<link rel="stylesheet" href="components/fig-assets.css">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #e9edf0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-family: Poppins, sans-serif; }

  #stage { position: fixed; inset: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 88px 24px 64px; background: #e9edf0; -webkit-overflow-scrolling: touch; }
  #stage::-webkit-scrollbar { width: 12px; height: 12px; }
  #stage::-webkit-scrollbar-thumb { background: rgba(0,47,66,0.22); border-radius: 8px; border: 3px solid #e9edf0; }
  #stage::-webkit-scrollbar-track { background: transparent; }

  #sizer { position: relative; flex: 0 0 auto; }
  #frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* Figma export fix: un-clip embedded SVGs so CTA arrowheads / icon tips show. */
  #frame svg { overflow: visible; }

  /* Desktop / Mobile toggle — faithful to AwenLab.dc.html toolbar */
  #toolbar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 2147483000;
    display: flex; gap: 4px; align-items: center; background: #fff; padding: 5px; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,47,66,0.18), 0 1px 0 rgba(0,47,66,0.04); border: 1px solid rgba(0,47,66,0.08); }
  #toolbar button { display: flex; align-items: center; gap: 8px; border: none; cursor: pointer; padding: 8px 16px;
    border-radius: 10px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 14px; line-height: 1;
    letter-spacing: 0.2px; background: transparent; color: rgb(0,47,66); transition: background .16s ease, color .16s ease; -webkit-tap-highlight-color: transparent; }
  #toolbar button.is-active { background: rgb(0,47,66); color: #fff; }
  #toolbar svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div id="toolbar" role="tablist" aria-label="Anteprima">
  <button type="button" id="btn-desktop" role="tab" aria-selected="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.5"></rect><path d="M5.5 14h5M8 11v3"></path></svg>
    <span>Desktop</span>
  </button>
  <button type="button" id="btn-mobile" role="tab" aria-selected="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="1.5" width="8" height="13" rx="2"></rect><path d="M7 12.5h2"></path></svg>
    <span>Mobile</span>
  </button>
</div>

<div id="stage">
  <div id="sizer">
    <div id="frame"></div>
  </div>
</div>

<!-- React runtime + the materialized design bundle (defines window.Desktop / window.Mobile) -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/Components.bundle.js"></script>

<script>
(function () {
  "use strict";
  var SIZES = { desktop: { w: 1728, h: 9636 }, mobile: { w: 430, h: 11018 } };
  var BREAKPOINT = 820; // below this, the Mobile layer is the better fit

  var stage = document.getElementById("stage");
  var sizer = document.getElementById("sizer");
  var frame = document.getElementById("frame");
  var btnD = document.getElementById("btn-desktop");
  var btnM = document.getElementById("btn-mobile");

  var manual = null;                 // user override: 'desktop' | 'mobile' | null
  var mode = autoMode();             // effective mode
  var rendered = null;               // last component rendered
  var root = ReactDOM.createRoot(frame);

  function autoMode() { return window.innerWidth < BREAKPOINT ? "mobile" : "desktop"; }
  function current() { return manual || mode; }

  function renderComponent() {
    var m = current();
    var Comp = m === "mobile" ? window.Mobile : window.Desktop;
    if (!Comp) return;
    if (rendered !== m) { root.render(React.createElement(Comp)); rendered = m; }
  }

  function applyScale() {
    var m = current();
    var fw = SIZES[m].w, fh = SIZES[m].h;
    var sidePad = 48;
    var avail = stage.clientWidth - sidePad;
    var s = Math.min(1, avail / fw);
    if (!isFinite(s) || s <= 0) s = 1;

    frame.style.width = fw + "px";
    frame.style.height = fh + "px";
    frame.style.transform = "scale(" + s + ")";

    if (m === "desktop") {
      frame.style.borderRadius = "0px";
      frame.style.overflow = "visible";
      frame.style.boxShadow = "0 14px 50px rgba(0,47,66,0.14)";
      sizer.style.borderRadius = "0px";
    } else {
      frame.style.borderRadius = "30px";
      frame.style.overflow = "hidden";
      frame.style.boxShadow = "0 20px 64px rgba(0,47,66,0.22)";
      sizer.style.borderRadius = (30 * s) + "px";
    }
    sizer.style.width = (fw * s) + "px";
    sizer.style.height = (fh * s) + "px";
  }

  function syncToolbar() {
    var m = current();
    btnD.classList.toggle("is-active", m === "desktop");
    btnM.classList.toggle("is-active", m === "mobile");
    btnD.setAttribute("aria-selected", m === "desktop");
    btnM.setAttribute("aria-selected", m === "mobile");
  }

  function update() { renderComponent(); applyScale(); syncToolbar(); }

  function setMode(m) {
    manual = m;
    stage.scrollTop = 0;
    update();
  }

  btnD.addEventListener("click", function () { setMode("desktop"); });
  btnM.addEventListener("click", function () { setMode("mobile"); });

  window.addEventListener("resize", function () {
    if (!manual) { mode = autoMode(); }
    update();
  });

  // initial paint + a couple of re-measures after fonts/bundle settle
  update();
  setTimeout(update, 80);
  setTimeout(update, 600);
  window.addEventListener("load", update);
})();
</script>
</body>
</html>
